name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build client
        run: dotnet build src/PclModpackUpdater/PclModpackUpdater.csproj -c Release -p:Platform=x64 -p:RuntimeIdentifier=win-x64

      - name: Build server
        run: dotnet build server/PclModpackUpdater.Server/PclModpackUpdater.Server.csproj -c Release

      - name: Upload client artifact
        uses: actions/upload-artifact@v4
        with:
          name: PclModpackUpdater-win-x64
          path: src/PclModpackUpdater/bin/x64/Release/net8.0-windows10.0.19041.0/win-x64/
          if-no-files-found: error

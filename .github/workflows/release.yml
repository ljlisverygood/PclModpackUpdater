name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: dotnet publish src/PclModpackUpdater/PclModpackUpdater.csproj -c Release -p:Platform=x64 -p:RuntimeIdentifier=win-x64

      - name: Zip
        run: Compress-Archive -Path "src/PclModpackUpdater/bin/x64/Release/net8.0-windows10.0.19041.0/win-x64/publish/*" -DestinationPath "PclModpackUpdater-win-x64.zip"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: PclModpackUpdater-win-x64.zip
          generate_release_notes: true
